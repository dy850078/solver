[project]
name = "vm-placement-solver"
version = "0.1.0"
description = "Python-based VM placement optimizer using OR-Tools CP-SAT solver"
requires-python = ">=3.12"
dependencies = [
    "ortools>=9.9",
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    # Not imported anywhere: ortools pulls pandas in (pandas>=2.0.0) and this
    # pins that transitive dependency to the version the solver was validated
    # against. Without it the resolver takes pandas 3.x, a major bump on a
    # library ortools uses internally — our tests would not notice a behaviour
    # change there. Remove only alongside a deliberate ortools/pandas upgrade.
    "pandas==2.3.3",
]

[project.optional-dependencies]
# swagger-ui-bundle only backs /docs. It is an extra so deployments whose
# index does not carry it still install cleanly; those vendor the assets and
# point SWAGGER_STATIC_DIR at them instead (see app/server.py).
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
    "swagger-ui-bundle>=0.0.9",
]

[project.scripts]
solver-server = "app.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
# pytest 固定從 tests/ 找測試，不需要在 terminal 指定路徑
testpaths = ["tests"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
